cs:
  homepage:
    hero:
      brand: "AI Jam"
      badge: "🧪 Živá laboratoř"
      title_html: "Chyť vlnu. <br class='hidden md:block' />Tvoř s námi."
      subtitle_html: "Nedebatujeme, jestli AI má smysl. <br /> <span class='bg-orange-300 px-1 border border-stone-900 rounded-md shadow-[2px_2px_0px_0px_#1c1917]'>Používáme ho</span> — na reálných problémech, v reálném čase."
      cta_join: "Připojit se k Jamu"
      cta_how: "Jak to probíhá"
    how_it_works:
      title: "Jak Jamujeme"
      subtitle: "Vaříme a sdílíme AI recepty."
      step_1:
        title: "1. Lightning Talks"
        description: "Pět minut, striktní timebox. Ukaž, co děláš — průlomy i slepé uličky. Žádné přednášky, jen signál."
      step_2:
        title: "2. Breakout Sessions"
        description: "Skupiny podle témat — technické i explorativní. Vybíráš si sám, kam půjdeš. Notebooky otevřené, tokeny hoří."
      step_3:
        title: "3. Regroup & Share"
        description: "Skupiny se sejdou a sdílí klíčové poznatky — zhuštěné na podstatu, aby z toho měli všichni."
    who_is_this_for:
      title: "Pro koho to je?"
      subtitle: "Mindset je důležitější než skill level."
      pragmatist:
        title: "Stavitel"
        description: "Víš, že AI je tam, kde potřebuješ být. Chceš ho aplikovat na reálné problémy — v práci, na projektech, v životě. Výsledky, ne hype."
      learner:
        title: "Průzkumník"
        description: "Jsi na začátku cesty, ale jiskra tam je. Nehledáš kurz — hledáš lidi, se kterými na to přijdeš."
      imposter:
        title: "Přispěvatel"
        description: "Nejenom konzumuješ — přinášíš témata, sdílíš experimenty, facilituješ diskuze. Místnost je lepší, protože v ní jsi."
    recipes:
      title: "Galerie Receptů"
      subtitle: "Skutečné problémy vyřešené skutečnými lidmi."
      view_all: "Zobrazit všechny recepty"
      read_recipe: "Číst recept"
      card_1:
        title: "Analýza Firebird databáze s Claude CLI"
        description: "\"Použil jsem Claude CLI v Dockeru k analýze struktury legacy Firebird databáze a generování migračních skriptů.\""
        author: "Z AI Jam sezení 27. listopadu"
      card_2:
        title: "Automatizace Fakturoidu"
        description: "\"Automatizoval jsem workflow zpracování faktur, ušetřím ~2 hodiny měsíčně na opakujících se úkolech.\""
        author: "Z AI Jam sezení 27. listopadu"
      card_3:
        title: "Převodník hlasu na prompty"
        description: "\"Pokusil jsem se generovat konverzační prompty z hlasových nahrávek. Smíšené výsledky—potřebuje více ladění.\""
        author: "Z AI Jam sezení 27. listopadu"
    join:
      title: "Cena za vstup je úsilí."
      subtitle_html: "Žádný poplatek. Přines něco — recept, experiment, téma, nebo pomoc s organizací.<br /> Měníme účast za účast."
