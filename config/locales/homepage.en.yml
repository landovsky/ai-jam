en:
  homepage:
    hero:
      brand: "AI Jam"
      badge: "🧪 A Living Lab"
      title_html: "Grab the Wave. <br class='hidden md:block' />Build Together."
      subtitle_html: "We don't debate whether AI matters. <br /> We <span class='bg-orange-300 px-1 border border-stone-900 rounded-md shadow-[2px_2px_0px_0px_#1c1917]'>use it</span> — on real problems, in real time."
      cta_join: "Join the Jam"
      cta_how: "How it Works"
    how_it_works:
      title: "How We Jam"
      subtitle: "Maximize doing, minimize listening."
      step_1:
        title: "1. Lightning Talks"
        description: "Five minutes, strict timebox. Show what you're working on — breakthroughs and dead ends alike. No keynotes, just signal."
      step_2:
        title: "2. Breakout Sessions"
        description: "Small groups form around topics — technical or exploratory. You pick where you go. Laptops open, tools running."
      step_3:
        title: "3. Regroup & Share"
        description: "Groups reconvene and share key takeaways — distilled to the essentials so everyone benefits."
    who_is_this_for:
      title: "Who is this for?"
      subtitle: "The mindset matters more than the skill level."
      pragmatist:
        title: "The Builder"
        description: "You know AI is where you need to be. You want to apply it to real problems — your work, your projects, your life. Results over hype."
      learner:
        title: "The Explorer"
        description: "You're earlier in the journey but you've got the spark. You're not looking for a course — you're looking for people to figure it out with."
      imposter:
        title: "The Contributor"
        description: "You don't just consume — you bring topics, share experiments, facilitate discussions. The room gets better because you're in it."
    recipes:
      title: "Recipe Gallery"
      subtitle: "Real problems solved by real people."
      view_all: "View all recipes"
      read_recipe: "Read Recipe"
      card_1:
        title: "Firebird Database Analysis with Claude CLI"
        description: "\"Used Claude CLI in Docker to analyze legacy Firebird database structure and generate migration scripts.\""
        author: "From AI Jam Session Nov 27"
      card_2:
        title: "Fakturoid Invoice Automation"
        description: "\"Automated invoice processing workflow, saving ~2 hours every month on repetitive tasks.\""
        author: "From AI Jam Session Nov 27"
      card_3:
        title: "Voice-to-Prompt Converter"
        description: "\"Attempted to generate conversational prompts from voice recordings. Mixed results—needs more tuning.\""
        author: "From AI Jam Session Nov 27"
    join:
      title: "The Price of Admission Is Effort."
      subtitle_html: "No fee. Just bring something — a recipe, an experiment, a topic, or help with organizing.<br /> We trade participation for participation."
